<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zovo.Jordan</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f7;
  color: #111;
}

header {
  background: #111;
  color: white;
  padding: 25px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin: 8px 0 0;
  color: #ccc;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 15px;
}

.product {
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.images {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.images img {
  width: 100%;
  height: 320px;
  object-fit: cover;
  border-radius: 15px;
}

h2 {
  font-size: 28px;
  margin-bottom: 10px;
}

.price {
  font-size: 26px;
  font-weight: bold;
  margin: 15px 0;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 18px;
  margin-bottom: 8px;
}

select,
input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 17px;
  background: white;
}

.total {
  margin-top: 20px;
  padding: 15px;
  background: #f1f1f1;
  border-radius: 12px;
  font-size: 21px;
  font-weight: bold;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #111;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}

@media (max-width: 600px) {
  .images {
    grid-template-columns: 1fr;
  }

  .images img {
    height: 280px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Zovo.Jordan</h1>
  <p>أناقتك تبدأ من هنا</p>
</header>

<div class="container">

  <div class="product">

    <div class="images">
      <img src="IMG_6886.jpeg" alt="منتج Zovo.Jordan">
      <img src="IMG_6887.jpeg" alt="منتج Zovo.Jordan">
    </div>

    <h2>منتج Zovo.Jordan</h2>

    <p>
      منتج مميز بتصميم أنيق وجودة عالية، مناسب لإطلالتك اليومية.
    </p>

    <div class="price">
      15 دينار أردني
    </div>

    <label for="color">اختر اللون</label>
    <select id="color">
      <option>أسود</option>
      <option>أبيض</option>
      <option>بيج</option>
      <option>رمادي</option>
    </select>

    <label for="size">اختر المقاس</label>
    <select id="size">
      <option>S</option>
      <option>M</option>
      <option>L</option>
      <option>XL</option>
    </select>

    <label for="quantity">الكمية</label>
    <input
      type="number"
      id="quantity"
      value="1"
      min="1"
      onchange="updateTotal()"
    >

    <div class="total">
      المجموع: <span id="total">15</span> دينار أردني
    </div>

    <button onclick="orderNow()">
      اطلب الآن
    </button>

  </div> <div class="product">
  <img src="IMG_6902.jpeg" alt="طقم أسود وأبيض Zovo.Jordan">

  <h2>طقم أسود وأبيض Zovo.Jordan</h2>

  <p>طقم أنيق ومميز، مناسب لإطلالتك اليومية.</p>

  <div class="price">
    20 دينار أردني
  </div>
</div>

</div>

<footer>
  © 2026 Zovo.Jordan - جميع الحقوق محفوظة
</footer>

<script>
function updateTotal() {
  const quantity = document.getElementById("quantity").value;
  const total = quantity * 15;

  document.getElementById("total").textContent = total;
}

function orderNow() {
  const color = document.getElementById("color").value;
  const size = document.getElementById("size").value;
  const quantity = document.getElementById("quantity").value;

  const message =
    "مرحباً، أريد طلب من Zovo.Jordan%0A" +
    "اللون: " + color + "%0A" +
    "المقاس: " + size + "%0A" +
    "الكمية: " + quantity + "%0A" +
    "السعر: " + (quantity * 15) + " دينار";

  window.open(
    "https://wa.me/?text=" + message,
    "_blank"
  );
}
</script>

</body>
</html>
